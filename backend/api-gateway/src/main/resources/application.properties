server.port=8080
spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# JWT Secret for Gateway token verification
aegis.jwt.secret=${JWT_SECRET:YOUR_SECURE_JWT_SECRET_KEY}

# Gateway Routes
# 1. Auth Service Route (Public)
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# 2. Policy Service Route
spring.cloud.gateway.routes[1].id=policy-service
spring.cloud.gateway.routes[1].uri=lb://policy-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/policies/**
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter

# 3. Claim Service Route
spring.cloud.gateway.routes[2].id=claim-service
spring.cloud.gateway.routes[2].uri=lb://claim-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/claims/**
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter

# 4. Approval Service Route
spring.cloud.gateway.routes[3].id=approval-service
spring.cloud.gateway.routes[3].uri=lb://approval-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/approvals/**
spring.cloud.gateway.routes[3].filters[0]=AuthenticationFilter

# Global CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
